<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dong Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>💰 Dong Calculator</h1>
    <p>Split the restaurant bill between friends.</p>

    <label for="bill">Total bill (Toman)</label>
    <input type="number" id="bill" placeholder="2000000">

    <label for="service">Service / tip (%)</label>
    <input type="number" id="service" placeholder="10">

    <label for="people">Number of people</label>
    <input type="number" id="people" placeholder="4">

    <button id="calcBtn">Calculate</button>
    <p id="result"></p>

    <a href="index.html">← Back to home</a>
    <script src="dong.js"></script>
</body>
</html>
