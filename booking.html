<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رزرو نوبت آرایشگاه</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>رزرو نوبت آرایشگاه</h1>
    <p>خدمت، ساعت و اطلاعات خود را وارد کنید.</p>

    <form id="bookingForm">
        <h2>انتخاب خدمت</h2>
        <div id="serviceList" class="service-list"></div>

        <h2>انتخاب ساعت</h2>
        <div id="timeList" class="time-list"></div>

        <label for="customerName">نام</label>
        <input type="text" id="customerName" placeholder="نام خود را وارد کنید">

        <label for="phoneNumber">شماره تلفن</label>
        <input type="tel" id="phoneNumber" placeholder="09123456789" maxlength="11">

        <button type="submit" id="reserveBtn" class="reserve-btn">رزرو</button>
        <p id="bookingError" class="booking-error" aria-live="polite"></p>
        <p id="bookingSuccess" class="booking-success" aria-live="polite"></p>
    </form>

    <a href="index.html">← بازگشت به صفحه اصلی</a>
    <script src="booking.js"></script>
</body>
</html>
